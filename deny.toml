[graph]
targets = []

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    # ar_archive_writer (Cedar build dependency): Apache-2.0 with a more
    # permissive exception for compiled/linked object code.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    # borrow-or-share (JSON Schema dependency): permissive MIT variant with
    # no attribution condition.
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
