[workspace]
resolver = "2"
members = [
    "crates/atf-core",
    "crates/atf-intent",
    "crates/atf-policy",
    "crates/atf-risk",
    "crates/atf-decision",
    "cli/atf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/chuhemiao/agentic-transaction-firewall"
authors = ["ATF Contributors"]

[workspace.dependencies]
atf-core = { path = "crates/atf-core" }
atf-intent = { path = "crates/atf-intent" }
atf-policy = { path = "crates/atf-policy" }
atf-risk = { path = "crates/atf-risk" }
atf-decision = { path = "crates/atf-decision" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "3", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-str"] }
jsonschema = "0.28"
cedar-policy = "4"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
