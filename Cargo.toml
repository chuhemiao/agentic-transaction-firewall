[workspace]
resolver = "2"
members = [
    "crates/atf-core",
    "crates/atf-intent",
    "crates/atf-identity",
    "crates/atf-policy",
    "crates/atf-risk",
    "crates/atf-audit",
    "crates/atf-decision",
    "crates/atf-store",
    "cli/atf-cli",
    "services/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/chuhemiao/agentic-transaction-firewall"
authors = ["ATF Contributors"]

[workspace.dependencies]
atf-core = { path = "crates/atf-core", version = "=0.1.0" }
atf-intent = { path = "crates/atf-intent", version = "=0.1.0" }
atf-identity = { path = "crates/atf-identity", version = "=0.1.0" }
atf-policy = { path = "crates/atf-policy", version = "=0.1.0" }
atf-risk = { path = "crates/atf-risk", version = "=0.1.0" }
atf-audit = { path = "crates/atf-audit", version = "=0.1.0" }
atf-decision = { path = "crates/atf-decision", version = "=0.1.0" }
atf-store = { path = "crates/atf-store", version = "=0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "3", features = ["serde"] }
sha2 = "0.10"
sha3 = "=0.10.9"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = { version = "=9.3.1", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
clap = { version = "4", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-str"] }
jsonschema = "0.28"
cedar-policy = "4"
ed25519-dalek = "3"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "=0.8.6", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
] }
# SQLx 0.8 accepts any home 0.5 release; 0.5.12 raised its MSRV to 1.88.
# Keep the dependency graph compatible with this workspace's Rust 1.82 floor.
home = "=0.5.11"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
