[package]
name = "atf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.82"

[package.metadata]
cargo-fuzz = true

[dependencies]
atf-intent = { path = "../crates/atf-intent", version = "=0.1.0" }
libfuzzer-sys = "=0.4.13"
serde_json = "=1.0.151"

[[bin]]
name = "intent"
path = "fuzz_targets/intent.rs"
test = false
doc = false
bench = false

# Keep the cargo-fuzz harness outside the stable root workspace: libFuzzer
# instrumentation requires the separately pinned nightly CI toolchain.
[workspace]
members = ["."]
