name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ATF_RUST_TOOLCHAIN: 1.95.0

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ATF_RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Rust SAST (Clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ATF_RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: ./scripts/test-rust-sast.sh

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ATF_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run persistence race suite twice
        env:
          ATF_PERSISTENCE_TEST_REPETITIONS: 2
        run: ./scripts/test-persistence.sh
      - name: Run Replay and property conformance
        run: ./scripts/test-conformance.sh
      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features

  fuzz:
    name: bounded Intent fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # rust-toolchain.toml intentionally pins the main workspace to stable;
      # override it only for libFuzzer instrumentation in this job.
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the public Intent boundary for 15 seconds
        run: ./scripts/test-fuzz.sh

  deny:
    name: cargo deny 0.20.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # v2.1.1 is the official cargo-deny 0.20.2 action release. Pin the
      # immutable commit so local and CI policy semantics cannot drift.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command-arguments: -D warnings

  security:
    name: dependency and secret gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history is intentional: Gitleaks verifies both committed history
      # and the checked-out PR tree through the same local runner.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.ATF_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned security tools
        shell: bash
        run: |
          source security/tool-versions.env
          tool_dir="$(mktemp -d)"
          trap 'rm -rf -- "${tool_dir}"' EXIT

          audit_archive="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          audit_release="https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}"
          curl --http1.1 --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            --output "${tool_dir}/${audit_archive}" \
            "${audit_release}/${audit_archive}"
          audit_actual="$(sha256sum "${tool_dir}/${audit_archive}" | awk '{ print $1 }')"
          test -n "${CARGO_AUDIT_LINUX_X64_SHA256}" \
            && test "${audit_actual}" = "${CARGO_AUDIT_LINUX_X64_SHA256}"
          tar -xzf "${tool_dir}/${audit_archive}" -C "${tool_dir}"
          install -m 0755 \
            "${tool_dir}/${audit_archive%.tgz}/cargo-audit" \
            "${HOME}/.cargo/bin/cargo-audit"

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --http1.1 --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 --retry 3 --retry-all-errors \
            --output "${tool_dir}/${archive}" "${release}/${archive}"
          expected="${GITLEAKS_LINUX_X64_SHA256}"
          actual="$(sha256sum "${tool_dir}/${archive}" | awk '{ print $1 }')"
          test -n "${expected}" && test "${actual}" = "${expected}"
          tar -xzf "${tool_dir}/${archive}" -C "${tool_dir}" gitleaks
          install -m 0755 "${tool_dir}/gitleaks" "${HOME}/.cargo/bin/gitleaks"
      - name: Run dependency, secret and negative-fixture gates
        run: ./scripts/test-security.sh
